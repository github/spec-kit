schema_version: "1.0"

bundle:
  id: "bugfix"
  name: "Guided Bug Fix"
  version: "1.0.0"
  role: "developer"
  description: "Orchestrated bug triage: assess a bug report, review the assessment behind a human gate, apply the fix, and verify it with tests."
  author: "GitHub"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"
  tools: []
  mcp: []

provides:
  extensions:
    - id: "bug"
      version: "1.0.0"
  workflows:
    - id: "bugfix"
      version: "1.0.0"

tags: ["bug", "triage", "workflow", "qa"]
